<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f472b6">
    <meta name="application-name" content="Income">
    <title>Income｜囍事快剪記帳與損益</title>
    <style>
        :root {
            --navy: #8f4668;
            --navy-2: #a85a7a;
            --ink: #684052;
            --muted: #9b7486;
            --canvas: #fff7fa;
            --surface: #ffffff;
            --line: #f1d6e0;
            --soft: #fff4f8;
            --amber: #e99ab4;
            --amber-soft: #fff0f5;
            --teal: #c96b92;
            --teal-soft: #faedf3;
            --red: #e11d48;
            --red-soft: #fff1f2;
            --green: #16825f;
            --green-soft: #e5f5ef;
            --shadow: 0 18px 50px rgba(143, 70, 104, .12);
            --shadow-sm: 0 8px 24px rgba(168, 90, 122, .09);
            --radius: 22px;
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; background: var(--canvas); }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-size: 17px;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 3%, rgba(236, 166, 187, .16), transparent 25rem),
                radial-gradient(circle at 93% 8%, rgba(225, 166, 194, .15), transparent 28rem),
                radial-gradient(circle at 50% 100%, rgba(242, 190, 204, .14), transparent 32rem),
                linear-gradient(145deg, #fffafc 0%, #fceef4 52%, #fff7fa 100%);
            font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        button, input { font: inherit; }
        button { color: inherit; }
        button:focus-visible, input:focus-visible {
            outline: 3px solid rgba(217, 154, 43, .35);
            outline-offset: 3px;
        }
        .hidden { display: none !important; }
        .app { min-height: 100dvh; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            min-height: 74px;
            padding: 12px max(20px, env(safe-area-inset-right)) 12px max(20px, env(safe-area-inset-left));
            color: #fff;
            background: linear-gradient(120deg, rgba(143, 70, 104, .96), rgba(199, 108, 147, .95), rgba(225, 139, 164, .95));
            border-bottom: 1px solid rgba(255,255,255,.12);
            backdrop-filter: blur(16px);
        }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand-logo-card { display: grid; place-items: center; flex: 0 0 auto; padding: 5px 9px; border-radius: 13px; background: rgba(255,255,255,.94); box-shadow: 0 8px 22px rgba(157,23,77,.18); }
        .brand-logo { display: block; width: 132px; height: 34px; object-fit: contain; }
        .brand-copy { min-width: 0; }
        .brand-name { font-weight: 900; letter-spacing: .04em; font-size: 18px; }
        .brand-page { margin-top: 2px; color: #fff5f8; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .topbar-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
        .connection-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 34px;
            padding: 7px 11px;
            border-radius: 999px;
            background: rgba(255,255,255,.10);
            color: #eaf0f4;
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
        }
        .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: #efb84e; box-shadow: 0 0 0 4px rgba(239,184,78,.12); }
        .connection-badge.online .connection-dot { background: #5dd2ad; box-shadow: 0 0 0 4px rgba(93,210,173,.12); }
        .connection-badge.offline .connection-dot { background: #f28a8a; box-shadow: 0 0 0 4px rgba(242,138,138,.12); }
        .connection-badge.saving .connection-dot { animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: .35; transform: scale(.78); } }

        .icon-button, .secondary-button, .primary-button, .ghost-button {
            border: 0;
            cursor: pointer;
            min-height: 44px;
            border-radius: 13px;
            font-weight: 900;
            font-size: 16px;
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
        }
        .icon-button:hover, .secondary-button:hover, .primary-button:hover, .ghost-button:hover { transform: translateY(-1px); }
        .icon-button { display: inline-grid; place-items: center; width: 44px; padding: 0; background: rgba(255,255,255,.11); color: #fff; }
        .ghost-button { padding: 0 16px; background: rgba(255,255,255,.11); color: #fff; }
        .primary-button { padding: 0 22px; background: linear-gradient(135deg, #d989a5, #cf79a0); color: #fff; box-shadow: 0 8px 20px rgba(168,90,122,.22); }
        .secondary-button { padding: 0 18px; background: var(--soft); color: var(--navy); }

        .page {
            width: min(1440px, 100%);
            margin: 0 auto;
            padding: 34px 26px calc(54px + env(safe-area-inset-bottom));
        }
        .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
        .eyebrow { margin: 0 0 7px; color: var(--teal); font-weight: 900; font-size: 14px; letter-spacing: .13em; text-transform: uppercase; }
        h1, h2, h3, p { margin-top: 0; }
        h1 { margin-bottom: 9px; color: var(--navy); font-size: clamp(30px, 4vw, 46px); line-height: 1.2; letter-spacing: -.025em; }
        .lead { margin-bottom: 0; color: var(--muted); font-size: 17px; line-height: 1.7; }

        .login-page {
            min-height: 100dvh;
            display: grid;
            grid-template-columns: minmax(320px, .85fr) minmax(560px, 1.15fr);
        }
        .login-intro {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100%;
            padding: clamp(34px, 7vw, 82px);
            color: #fff;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 15% 10%, rgba(255,255,255,.28), transparent 16rem),
                radial-gradient(circle at 95% 88%, rgba(255,228,236,.35), transparent 24rem),
                linear-gradient(145deg, #a95f80 0%, #cb7a9d 48%, #e391aa 100%);
        }
        .login-brand { position: relative; z-index: 2; display: flex; align-items: center; gap: 14px; }
        .login-brand .brand-logo-card { padding: 7px 12px; border-radius: 16px; }
        .login-brand .brand-logo { width: min(250px, 34vw); height: 54px; }
        .login-copy { position: relative; z-index: 2; max-width: 580px; padding: 68px 0; }
        .login-copy .eyebrow { color: #fff0a8; }
        .login-copy h1 { max-width: 11em; color: #fff; font-size: clamp(42px, 6vw, 70px); }
        .login-copy p { max-width: 36em; color: #fff4f8; font-size: 19px; line-height: 1.8; }
        .login-note { position: relative; z-index: 2; color: #ffe6ef; font-size: 14px; line-height: 1.7; }
        .hero-logo-card { width: min(470px, 100%); margin: 0 auto 34px; padding: 16px 22px; border: 2px solid rgba(255,255,255,.62); border-radius: 24px; background: rgba(255,255,255,.95); box-shadow: 0 20px 50px rgba(122,20,64,.22); transform: none; }
        .hero-logo-card img { display: block; width: 100%; height: auto; }
        .emoji-ribbon { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; font-size: 25px; filter: drop-shadow(0 4px 7px rgba(122,20,64,.2)); }
        .sakura-sprinkles { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .sakura-sprinkles span { position: absolute; opacity: .32; filter: drop-shadow(0 5px 8px rgba(122,20,64,.18)); }
        .sakura-sprinkles span:nth-child(1) { left: 7%; top: 18%; font-size: 34px; transform: rotate(-14deg); }
        .sakura-sprinkles span:nth-child(2) { right: 9%; top: 12%; font-size: 46px; transform: rotate(18deg); }
        .sakura-sprinkles span:nth-child(3) { left: 17%; bottom: 12%; font-size: 54px; transform: rotate(12deg); }
        .sakura-sprinkles span:nth-child(4) { right: 13%; bottom: 24%; font-size: 30px; transform: rotate(-18deg); }
        .sakura-sprinkles span:nth-child(5) { left: 45%; top: 4%; font-size: 26px; }
        .login-select {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(30px, 6vw, 78px);
        }
        .login-select-inner { width: min(670px, 100%); margin: auto; }
        .login-select h2 { margin-bottom: 8px; color: var(--navy); font-size: clamp(32px, 4vw, 46px); }
        .profile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 30px; }
        .profile-card {
            position: relative;
            min-height: 260px;
            overflow: hidden;
            padding: 28px;
            text-align: left;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: rgba(255,255,255,.86);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
        }
        .profile-card::after { content: "🌸"; position: absolute; display: grid; place-items: center; width: 160px; height: 160px; right: -72px; bottom: -70px; border-radius: 50%; background: var(--profile-soft); font-size: 54px; }
        .profile-card:hover { transform: translateY(-5px); border-color: var(--profile); box-shadow: var(--shadow); }
        .profile-avatar {
            position: relative;
            z-index: 1;
            display: grid;
            place-items: center;
            width: 82px;
            height: 82px;
            margin-bottom: 34px;
            border-radius: 26px;
            color: #fff;
            background: linear-gradient(145deg, var(--profile), #dda0b6);
            font-size: 34px;
            font-weight: 900;
            box-shadow: 0 12px 24px color-mix(in srgb, var(--profile) 26%, transparent);
        }
        .profile-card h3 { position: relative; z-index: 1; margin-bottom: 7px; color: var(--navy); font-size: 29px; }
        .profile-meta { position: relative; z-index: 1; color: var(--muted); font-size: 16px; font-weight: 700; }
        .profile-enter { position: absolute; z-index: 2; right: 24px; top: 26px; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; color: var(--profile); background: var(--profile-soft); font-size: 20px; }
        .admin-login-button { width: 100%; margin-top: 18px; padding: 16px 18px; border: 1px solid #eab8cb; border-radius: 16px; color: var(--navy); background: linear-gradient(135deg, #fff, #fff1f6); box-shadow: var(--shadow-sm); cursor: pointer; font-size: 17px; font-weight: 900; }
        .admin-login-button:hover { border-color: var(--amber); transform: translateY(-1px); }
        .login-status { margin-top: 24px; display: flex; justify-content: center; }
        .login-status .connection-badge { background: #fff; color: var(--muted); border: 1px solid var(--line); }

        .year-control { display: flex; align-items: center; gap: 8px; padding: 6px; border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: var(--shadow-sm); }
        .year-control button { width: 46px; height: 46px; border: 0; border-radius: 11px; background: var(--soft); color: var(--navy); cursor: pointer; font-size: 21px; }
        .year-value { min-width: 110px; text-align: center; color: var(--navy); font-size: 23px; font-weight: 900; }

        .month-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
        .month-card { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,255,255,.93); box-shadow: var(--shadow-sm); }
        .month-card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 15px; border-bottom: 1px solid var(--line); background: linear-gradient(135deg, #fffafc, #fbedf3); }
        .month-card-header h2 { margin: 0; color: var(--navy); font-size: 23px; }
        .month-count { padding: 6px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 13px; font-weight: 900; }
        .slot-list { display: grid; gap: 9px; padding: 14px; }
        .slot-shell { position: relative; }
        .closing-slot {
            width: 100%;
            min-height: 72px;
            display: grid;
            grid-template-columns: 40px minmax(0, 1fr) auto;
            align-items: center;
            gap: 11px;
            padding: 10px 12px;
            text-align: left;
            border: 1px dashed #f4aac7;
            border-radius: 15px;
            background: #fbfcfc;
            cursor: pointer;
            transition: background .18s ease, border-color .18s ease, transform .18s ease;
        }
        .closing-slot:hover { transform: translateY(-1px); border-color: var(--teal); background: #fff3f7; }
        .closing-slot.has-date { padding-right: 48px; border-style: solid; border-color: #f5b6cf; background: linear-gradient(135deg, #fff1f6, var(--teal-soft)); }
        .slot-number { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; color: var(--navy); background: var(--soft); font-size: 17px; font-weight: 900; }
        .has-date .slot-number { color: #fff; background: var(--teal); }
        .slot-copy { min-width: 0; }
        .slot-title { display: block; color: var(--navy); font-size: 17px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slot-subtitle { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 700; }
        .slot-arrow { color: var(--teal); font-size: 20px; }
        .date-edit {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 10px;
            color: var(--teal);
            background: rgba(255,255,255,.72);
            cursor: pointer;
        }

        .summary-banner {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding: 18px 20px;
            border: 1px solid #f6bed2;
            border-radius: var(--radius);
            background: linear-gradient(135deg, #fff8fb, #ffe4ee, var(--teal-soft));
        }
        .back-button { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 16px; border: 1px solid var(--line); border-radius: 13px; background: #fff; color: var(--navy); font-size: 16px; font-weight: 900; cursor: pointer; }
        .closing-date { color: var(--navy); font-size: 23px; font-weight: 900; }
        .closing-context { margin-top: 4px; color: var(--muted); font-size: 14px; font-weight: 700; }
        .progress-pill { min-width: 120px; padding: 11px 14px; text-align: center; border-radius: 13px; background: #fff; color: var(--teal); font-size: 14px; font-weight: 900; box-shadow: var(--shadow-sm); }
        .formula-note { margin: 0 0 18px; padding: 13px 17px; border-left: 4px solid var(--amber); border-radius: 0 12px 12px 0; background: var(--amber-soft); color: #7c3659; font-size: 15px; font-weight: 800; line-height: 1.7; }

        .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); }
        .summary-table { width: 100%; min-width: 0; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
        .summary-table th { position: sticky; top: 0; z-index: 2; width: 9.666%; padding: 16px 7px; color: #fff; background: linear-gradient(135deg, #a75b7c, #c87499); font-size: 16px; letter-spacing: 0; line-height: 1.4; text-align: center; white-space: normal; }
        .summary-table th:first-child { left: 0; z-index: 4; width: 13%; text-align: left; }
        .summary-table td { height: 70px; padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: right; font-size: 16px; font-variant-numeric: tabular-nums; font-weight: 800; white-space: nowrap; }
        .summary-table tbody tr:last-child td { border-bottom: 0; }
        .summary-table tbody tr:hover td { background: #fff5f8; }
        .summary-table td:first-child { position: sticky; left: 0; z-index: 1; background: #fff; text-align: left; }
        .branch-cell { display: flex; align-items: center; gap: 10px; }
        .branch-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 46px;
            padding: 6px 12px 6px 7px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fff;
            color: var(--navy);
            cursor: pointer;
            font-size: 17px;
            font-weight: 900;
            transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
        }
        .branch-button:hover { transform: translateY(-1px); border-color: var(--amber); box-shadow: var(--shadow-sm); }
        .store-icon { position: relative; display: grid; place-items: center; width: 38px; height: 38px; border: 2px solid #ffc4d9; border-radius: 13px; background: linear-gradient(145deg, #fffafc, #ffe4ee); overflow: hidden; box-shadow: 0 5px 12px rgba(236,72,153,.16); font-size: 23px; }
        .store-icon::before { content: "💈"; filter: drop-shadow(0 2px 3px rgba(190,24,93,.15)); }
        .store-icon::after { content: none; }
        .branch-status { color: var(--teal); font-size: 13px; }
        .locked-cell { color: #7c3659; background: #fffafd; cursor: not-allowed; user-select: none; }
        .locked-cell.empty { color: #b5bfc5; font-weight: 600; }
        .diff-positive { color: var(--green) !important; background: var(--green-soft) !important; box-shadow: inset 0 0 0 2px #6ee7a3, inset 0 0 20px rgba(34,197,94,.28); text-shadow: 0 0 9px rgba(34,197,94,.38); }
        .diff-negative { color: var(--red) !important; background: var(--red-soft) !important; box-shadow: inset 0 0 0 2px #ff7a9e, inset 0 0 20px rgba(244,63,94,.3); text-shadow: 0 0 9px rgba(244,63,94,.38); }
        .status-cell { text-align: center !important; }
        .checkout-alert { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 7px 9px; border: 2px solid #ff4d7d; border-radius: 10px; color: #e11d48; background: #fff0f4; box-shadow: 0 0 14px rgba(255,45,101,.5), inset 0 0 12px rgba(255,77,125,.16); text-shadow: 0 0 8px rgba(225,29,72,.42); font-size: 14px; font-weight: 900; white-space: nowrap; }
        .total-row td { position: sticky; bottom: 0; z-index: 1; color: var(--navy); background: #ffe8f0 !important; border-top: 2px solid #f3b5cd; border-bottom: 0; font-weight: 900; }
        .total-row td:first-child { z-index: 3; }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: grid;
            place-items: center;
            padding: 18px;
            background: rgba(14, 30, 43, .58);
            backdrop-filter: blur(8px);
        }
        .modal-card { width: min(560px, 100%); max-height: min(90dvh, 860px); overflow: auto; border-radius: 26px; background: #fff; box-shadow: 0 30px 90px rgba(9,25,37,.32); }
        .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 24px 24px 17px; border-bottom: 1px solid var(--line); }
        .modal-header h2 { margin-bottom: 6px; color: var(--navy); font-size: 27px; }
        .modal-header p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
        .modal-close { display: grid; place-items: center; width: 40px; height: 40px; flex: 0 0 auto; border: 0; border-radius: 12px; background: var(--soft); color: var(--navy); cursor: pointer; font-size: 22px; }
        .modal-body { padding: 22px 24px 8px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 18px 24px 24px; }
        .field { margin-bottom: 17px; }
        .field label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; color: var(--navy); font-size: 15px; font-weight: 900; }
        .field-note { color: var(--muted); font-size: 13px; font-weight: 700; }
        .field input { width: 100%; min-height: 56px; padding: 13px 14px; border: 1px solid #efb5cd; border-radius: 13px; background: #fff; color: var(--ink); font-size: 20px; font-weight: 800; }
        .field input:focus { border-color: var(--amber); box-shadow: 0 0 0 4px rgba(217,154,43,.12); outline: 0; }
        .entry-section {
            --section-bg-start: #fff;
            --section-bg-end: #fff;
            --section-border: var(--line);
            --section-accent: var(--navy);
            margin-bottom: 17px;
            padding: 18px;
            border: 1px solid var(--section-border);
            border-left: 6px solid var(--section-accent);
            border-radius: 20px;
            background: linear-gradient(145deg, var(--section-bg-start), var(--section-bg-end));
            box-shadow: 0 8px 22px color-mix(in srgb, var(--section-accent) 9%, transparent);
        }
        .entry-section-ticket { --section-bg-start: #f8f5ff; --section-bg-end: #eef5ff; --section-border: #cbd0f0; --section-accent: #62699b; }
        .entry-section-cash { --section-bg-start: #fff9ef; --section-bg-end: #ffeedb; --section-border: #efc99b; --section-accent: #975f28; }
        .entry-section-petty { --section-bg-start: #f1faf4; --section-bg-end: #e7f5ec; --section-border: #b9ddc5; --section-accent: #447a59; }
        .entry-section-summary { --section-bg-start: #fff3f8; --section-bg-end: #f8efff; --section-border: #e7bfd8; --section-accent: #914f75; }
        .entry-section-title { display: flex; align-items: center; gap: 9px; margin-bottom: 17px; color: var(--section-accent); font-size: 18px; font-weight: 900; letter-spacing: .02em; }
        .entry-section-title span { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--section-border); border-radius: 11px; background: rgba(255,255,255,.72); font-size: 19px; }
        .entry-section .field:last-of-type { margin-bottom: 0; }
        .entry-section .field label, .entry-section .expense-heading { color: var(--section-accent); }
        .entry-section .field input { border-color: var(--section-border); background: rgba(255,255,255,.9); }
        .entry-section .field input:focus { border-color: var(--section-accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--section-accent) 14%, transparent); }
        .entry-section .calculation-panel { margin-bottom: 0; border: 1px solid var(--section-border); background: rgba(255,255,255,.48); }

<script type="text/plain" id="income-firestore-rules">
// 放在現有 Firestore 規則的 match /databases/{database}/documents 內，取代原有 Income 授權，並核對是否有其他重疊規則授權其他帳號。
match /Income/{store}/months/{period} {
  function allowed() {
    let t = request.auth.token;
    return t.get('email','') == 'nick@xishihaircut.internal' && (t.get('admin',false) == true || t.get('role','') == 'admin');
  }
  allow get, list: if request.auth != null && allowed();
  allow create, update: if request.auth != null && allowed()
    && period.matches('[0-9]{4}-(0[1-9]|1[0-2])')
    && request.resource.data.keys().hasOnly(['store','period','rows'])
    && request.resource.data.store == store && request.resource.data.period == period
    && request.resource.data.rows is map;
}
match /Income/{store}/settings/recurring {
  function nick() {
    let t = request.auth.token;
    return t.get('email','') == 'nick@xishihaircut.internal' && (t.get('admin',false) == true || t.get('role','') == 'admin');
  }
  allow get: if request.auth != null && nick();
  allow create, update: if request.auth != null && nick()
    && request.resource.data.keys().hasOnly(['items']) && request.resource.data.items is map;
}

        function renderLogin(message=''){
            currentView='login';
            app.innerHTML='<section class="login-page"><div class="login-intro"><div class="login-brand"><strong>囍事快剪</strong></div><div class="login-copy"><div class="hero-logo-card">'+brand()+'</div><p class="eyebrow">Income</p><div class="section-head"><h1>各店記帳與損益</h1><button id="edit-fixed" class="secondary-button" aria-haspopup="dialog" disabled>修改每月固定項目</button></div><p>逐月登記各店收支，查看分店和總公司的全年損益。</p></div></div><div class="login-select"><div class="login-select-inner"><h2>Nick 管理者登入</h2><form id="nick-login" class="ledger ledger-form"><label>密碼<input name="password" type="password" autocomplete="current-password" required></label><div><button class="primary-button" type="submit">登入年度總覽</button></div><p role="status"></p></form></div></div></section>';
            const form=$('#nick-login'),status=form.querySelector('[role=status]'),btn=form.querySelector('button');
            status.textContent=message;btn.disabled=!cloud;
            form.onsubmit=async event=>{
                event.preventDefault();btn.disabled=true;status.textContent='正在驗證身分…';
                try{await cloud.authApi.signInWithEmailAndPassword(cloud.auth,nickEmail,form.elements.password.value);}
                catch(e){status.textContent=e.code==='auth/network-request-failed'?'無法連線，請檢查網路。':'登入失敗，請確認密碼後再試。';btn.disabled=false;}
            };
        }
        window.logout=async function(){
            try{await cloud.authApi.signOut(cloud.auth);}
            catch{showToast('登出失敗，請重試。');}
        };

function escapeAttribute(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        
function showToast(message) {
            const toast = $('#toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        
const incomeStores = ['陽明','大昌','建興','後昌','左營','明誠','華榮','斗六','光遠','大社','虎尾','內惟','一心','五甲','斗六2','瑞隆','德惠','自由','福山','大寮','復興','鼎中','十全','華夏','武廟','小港'];
        const headquarters = '總公司';
        const storeLabel = name => name === headquarters ? name : name === '五甲' ? '新五甲店' : name+'店';
        const nt = n => new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',minimumFractionDigits:0,maximumFractionDigits:0}).format(n/100);
        let incomeRequest = 0;

        const weekFields={notes:'紙鈔',coins:'零錢',cc:'信用卡',line:'LINE Pay',receipt:'結帳單'};
        const weekKey=i=>'revenue-week-'+(i+1);
        function weeklyActual(w){
            return ['notes','coins','cc','line'].reduce((total,k)=>total+(w[k]??0),0);
        }
        const wholeMoney=new Intl.NumberFormat('zh-TW',{maximumFractionDigits:0});
        function displayDiff(element,cents){
            element.dataset.sign=cents==null?'pending':cents>0?'positive':cents<0?'negative':'zero';
            element.textContent=cents==null?'—':(cents>0?'+':'')+wholeMoney.format(cents/100);
        }
        function renderWeeks(rows,store,period){
            const lines=Array.from({length:6},(_,i)=>{
                const entry=rows[weekKey(i)], w=entry?.weekly||{};
                const field=k=>`<td><input aria-label="第 ${i+1} 列${weekFields[k]}" type="text" pattern="[0-9]{1,10}" title="請輸入 0 至 9999999999 的整數金額" inputmode="numeric" name="${k}" placeholder="${weekFields[k]}" value="${w[k]==null?'':Math.round(w[k]/100)}"></td>`;
                return `<tr data-week="${i}"><th scope="row"><span>${i+1}</span></th><td><input aria-label="第 ${i+1} 列日期" type="date" name="date" value="${escapeAttribute(entry?.date||'')}"></td>
                ${['notes','coins','cc','line'].map(field).join('')}<td><output data-actual></output></td>${field('receipt')}<td><output data-diff></output></td></tr>`;
            }).join('');
            return `<details open class="week-sheet"><summary><span>🏬 ${storeLabel(store)} · ${Number(period.slice(5))} 月營收紀錄表</span><span class="sheet-toggle" aria-hidden="true"></span></summary>
            <form id="weeks-form"><div class="ledger-scroll"><table class="weeks"><thead><tr>${['序號','🗓️ 日期','💵 紙鈔','🪙 零錢','💳 信用卡','📱 LINE Pay','🧾 實際營收小計','📝 結帳單金額','⚖️ 正負差額'].map(l=>'<th scope="col">'+l+'</th>').join('')}</tr></thead><tbody>${lines}</tbody>
            <tfoot><tr><th colspan="6">✨ 營收合計</th><td><output id="weeks-total"></output></td><th>差額合計</th><td><output id="weeks-diff"></output></td></tr></tfoot></table></div>
            <div class="sheet-actions"><p role="status"></p><button type="button" class="secondary-button" data-later>稍後再填</button><button class="primary-button">儲存並同步至雲端</button></div></form></details>`;
        }
        function bindWeeks(rows,store,period,active){
            const form=$('#weeks-form');
            const lines=[...form.querySelectorAll('[data-week]')];
            function fields(line){
                const values={};
                for(const k of Object.keys(weekFields)){
                    const input=line.querySelector('[name="'+k+'"]');
                    values[k]=/^[0-9]{1,10}$/.test(input.value)?Number(input.value)*100:null;
                }
                return values;
            }
            function refresh(){
                let total=0,diff=0,compared=false;
                for(const line of lines){
                    const w=fields(line),actual=weeklyActual(w);
                    total+=actual;
                    line.querySelector('[data-actual]').textContent=wholeMoney.format(actual/100);
                    const difference=w.receipt==null?null:w.receipt-actual;
                    displayDiff(line.querySelector('[data-diff]'),difference);
                    if(difference!=null){compared=true;diff+=difference;}
                }
                $('#weeks-total').textContent=wholeMoney.format(total/100);
                displayDiff($('#weeks-diff'),compared?diff:null);
            }
            form.querySelector('[data-later]').onclick=()=>{form.closest('details').open=false;form.closest('details').querySelector('summary').focus();};
            const snapshot=line=>JSON.stringify([line.querySelector('[name=date]').value,fields(line)]);
            const initial=lines.map(snapshot);
            form.oninput=refresh;refresh();
            form.onsubmit=async e=>{
                e.preventDefault();
                const edits=[];
                for(const [i,line] of lines.entries()){
                    if(snapshot(line)===initial[i])continue;
                    const w=fields(line),date=line.querySelector('[name=date]').value;
                    if(date && Object.values(w).every(v=>v==null)){form.querySelector('[role=status]').textContent='第 '+(i+1)+' 週請填寫至少一個金額，或清空日期以移除紀錄。';return;}
                    const entry=Object.values(w).every(v=>v==null)?null:{weekly:w,date,kind:'收入',item:'第 '+(i+1)+' 週營收',payee:'',cents:weeklyActual(w)};
                    edits.push([weekKey(i),entry]);
                }
                if(!edits.length){form.querySelector('[role=status]').textContent='目前沒有變更。';return;}
                if(edits.some(([,entry])=>!entry) && !confirm('確定移除已清空的週營收紀錄？'))return;
                const status=form.querySelector('[role=status]');
                form.querySelectorAll('button,input').forEach(el=>el.disabled=true);
                status.textContent='正在儲存…';
                try{
                    await cloud.incomeTransaction(async tx=>{
                        const target=cloud.incomeRef(store,period),doc=await tx.get(target);
                        const updated={...doc.data()?.rows};
                        for(const [id,entry] of edits){
                            if(updated[id]?.revision!==rows[id]?.revision)throw Error('conflict');
                            if(entry)updated[id]={...entry,revision:(updated[id]?.revision||0)+1};else delete updated[id];
                        }
                        tx.set(target,{store,period,rows:updated});
                    });
                    if(active()){showToast('週營收已儲存');openIncome(period,store);}
                }catch(error){
                    form.querySelectorAll('button,input').forEach(el=>el.disabled=false);
                    status.textContent=error.message==='conflict'?'其他裝置已更新同一週，請重新讀取。':'週營收未儲存，請檢查網路及寫入權限。';
                }
            };
        }
        function revenueGrid(docs,year){
            const branches=docs.filter(([store])=>store!==headquarters);
            const sums=Array(12).fill(null);
            const body=branches.map(([store,periods])=>{
                const cells=periods.map((p,i)=>{
                    const income=Object.values(p.data().rows).filter(row=>row.kind==='收入');
                    const amount=income.reduce((sum,r)=>sum+r.cents,0);
                    if(income.length)sums[i]=(sums[i]||0)+amount;
                    return {id:p.id,amount,exists:income.length>0};
                });
                const total=cells.reduce((s,c)=>s+c.amount,0);
                return `<tr><th>${storeLabel(store)}</th>${cells.map(c=>`<td><button class="small-action" data-revenue-store="${store}" data-period="${c.id}">${c.exists?nt(c.amount):'登記'}</button></td>`).join('')}<td>${cells.some(c=>c.exists)?nt(total):'—'}</td></tr>`;
            }).join('');
            return `<details class="zone income-zone"><summary>${year} 年各分店營收總表</summary><p>點選分店與月份交叉處，可開啟該月的週營收紀錄。</p><div class="ledger-scroll"><table><thead><tr><th>分店</th>${sums.map((_,i)=>'<th>'+(i+1)+' 月</th>').join('')}<th>全年營收</th></tr></thead><tbody>${body}</tbody><tfoot><tr><th>合計</th>${sums.map(n=>'<td>'+(n==null?'—':nt(n))+'</td>').join('')}<td>${sums.some(n=>n!=null)?nt(sums.reduce((a,n)=>a+(n||0),0)):'—'}</td></tr></tfoot></table></div></details>`;
        }
const fixedCatalog = {
            rent:'分店房租', clean:'樂清（地墊清潔費）',
            yuanta:'元大銀行房貸（美術皇居66號／68號／隆大）',
            esun:'玉山銀行房貸（大社）', land:'土地銀行房貸（台灣隱賦）',
            salary:'總薪資', bonus:'分紅獎金'
        };
        function fixedKeys(store) {
            return store===headquarters?['clean','yuanta','esun','land','salary','bonus']:['rent'];
        }
        function fixedValue(series,period) {
            const changes=series?.changes||{};
            const from=Object.keys(changes).filter(month=>month<=period).sort().pop();
            const monthly=series?.monthly||{};
            const override=Object.hasOwn(monthly,period);
            const cents=override?monthly[period]:(changes[from]??null);
            return {cents,source:override?'本月指定':cents!=null?'自 '+from+' 沿用':'待填金額'};
        }
        function fixedRows(store,settings,period) {
            const rows={};
            for(const key of fixedKeys(store)){
                const {cents}=fixedValue(settings[key],period);
                if(cents!=null)rows['fixed:'+key]={kind:'支出',item:fixedCatalog[key],date:period+'-01',cents};
            }
            return rows;
        }
        function fixedForm(store,settings,period) {
            return '<section><p>金額留白的項目暫不計入。若同筆費用已在其他明細登記，請擇一保留。選擇「本月起每月沿用」後，未來月份的月報及年報也會列入該金額。</p>'+
                fixedKeys(store).map(key=>{
                    const v=fixedValue(settings[key],period);
                    return `<form class="ledger-form" data-fixed="${key}"><h3>${fixedCatalog[key]}</h3>
                    <label>金額（新臺幣）<input name="amount" type="text" pattern="[0-9]{1,10}" title="請輸入 0 至 9999999999 的整數金額" inputmode="numeric" required value="${v.cents==null?'':Math.round(v.cents/100)}"></label>
                    <label>套用方式<select name="scope"><option value="one">只設定本月</option><option value="forward">本月起每月沿用</option><option value="stop">本月起停止沿用</option><option value="reset">取消本月指定金額</option></select></label>
                    <div><button class="secondary-button">儲存設定</button></div><p role="status">${v.source}</p></form>`;
                }).join('')+'</section>';
        }
        function changeFixed(series,period,scope,cents) {
            const monthly={...series?.monthly},changes={...series?.changes};
            if(scope==='one') monthly[period]=cents;
            else {
                delete monthly[period];
                if(scope==='forward')changes[period]=cents;
                if(scope==='stop')changes[period]=null;
            }
            return {monthly,changes,revision:(series?.revision||0)+1};
        }
        function sumLedger(rows) {
            let revenue = 0, expense = 0;
            for (const row of Object.values(rows)) {
                if (row.kind === '收入') revenue += row.cents;
                else expense += row.cents;
            }
            return {revenue, expense, profit: revenue-expense};
        }


        function summarizeYear(docs) {
            const months=Array.from({length:12},()=>({revenue:0,expense:0,hq:0,count:0}));
            for(const [store,list] of docs) for(const doc of list) {
                const m=months[Number(doc.id.slice(5))-1],rows=doc.data().rows || {};
                if(!m || !Object.keys(rows).length)continue;
                const t=sumLedger(rows);
                m.count++;
                if(store===headquarters)m.hq+=t.expense;
                else {m.revenue+=t.revenue;m.expense+=t.expense;}
            }
            const annual={revenue:0,expense:0,hq:0,count:0};
            for(const m of months){
                annual.revenue+=m.revenue;annual.expense+=m.expense;annual.hq+=m.hq;
                if(m.count)annual.count++;
            }
            return {months,annual};
        }
        window.openIncomeYear=async function(year,selected) {
            if(!cloud || !authState.uid)return;
            year=Number(year)||Number(new Intl.DateTimeFormat('en',{year:'numeric',timeZone:'Asia/Taipei'}).format(new Date()));
            if(!Number.isInteger(year)||year<1900||year>9999)return;
            const stores=[headquarters,...incomeStores];
            if(!stores.length)return;
            selected=stores.includes(selected)?selected:stores[0];
            const company=selected===headquarters, visible=company?stores:[selected];
            const seq=++incomeRequest,uid=authState.uid;
            currentView='incomeYear';
            const active=()=>currentView==='incomeYear' && seq===incomeRequest && uid===authState.uid;
            app.innerHTML=topbar('年度損益')+`<main class="page ledger"><h1>年度損益總覽</h1>
            <div class="ledger-tools"><label>年度<input id="yr" type="number" min="1900" max="9999" required value="${year}"></label><label>帳本<select id="yr-store">${stores.map(s=>`<option value="${s}" ${selected===s?'selected':''}>${storeLabel(s)}</option>`).join('')}</select></label></div>
            <section id="yr-data" aria-live="polite">正在讀取年度帳本…</section></main>`;
            $('#yr').onchange=e=>{if(e.target.reportValidity())openIncomeYear(e.target.value,selected);};
            $('#yr-store').onchange=e=>openIncomeYear(year,e.target.value);
            const panel=$('#yr-data');
            try{
                const docs=await Promise.all(visible.map(async store=>{
                    const [book,config]=await Promise.all([cloud.incomeYear(store,year),cloud.readIncome(cloud.fixedRef(store))]);
                    const items=config.data()?.items||{};
                    const recorded=new Map(book.docs.map(doc=>[doc.id,doc.data().rows||{}]));
                    const periods=Array.from({length:12},(_,i)=>{
                        const id=year+'-'+String(i+1).padStart(2,'0');
                        return {id,data:()=>({rows:{...recorded.get(id),...fixedRows(store,items,id)}})};
                    });
                    return [store,periods];
                }));
                if(!active())return;
                const {months,annual}=summarizeYear(docs);
                const profit=m=>m.revenue-m.expense-m.hq;
                const values=m=>[m.revenue,m.expense,...(company?[m.hq]:[]),profit(m)].map(v=>`<td class="${v<0?'loss':''}">${m.count?nt(v):'—'}</td>`).join('');
                panel.innerHTML=`<h2>${year} 年 · ${storeLabel(selected)}</h2><div class="ledger-stats">${[['年度營業收入',annual.revenue],['年度總支出',annual.expense+annual.hq],['年度損益',profit(annual)]].map(([l,v],i)=>`<div class="${['income-zone','expense-zone','profit-zone'][i]}"><span>${l}</span><strong class="${v<0?'loss':''}">${annual.count?nt(v):'—'}</strong></div>`).join('')}</div>
                <p>已登記 ${annual.count}／12 個月。年度合計含逐筆明細與每月固定支出，包含已設定沿用金額的未來月份。</p><div class="ledger-scroll"><table><thead><tr><th>月份</th><th>營業收入</th><th>分店支出</th>${company?'<th>公司支出</th>':''}<th>損益</th><th>登記情形</th></tr></thead><tbody>
                ${months.map((m,i)=>`<tr><th><button class="small-action" data-month="${i+1}">${i+1} 月</button></th>${values(m)}<td>${m.count?(company?m.count+'／'+visible.length+' 本有明細':'已登記'):'尚未記帳'}</td></tr>`).join('')}
                </tbody><tfoot><tr><th>全年合計</th>${values(annual)}<td>${annual.count} 個月</td></tr></tfoot></table></div>`;
                panel.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>openIncome(year+'-'+b.dataset.month.padStart(2,'0'),selected));
                if(company){
                    panel.insertAdjacentHTML('beforeend',revenueGrid(docs,year));
                    panel.querySelectorAll('[data-revenue-store]').forEach(b=>b.onclick=()=>openIncome(b.dataset.period,b.dataset.revenueStore));
                }
            }catch(error){
                if(!active())return;
                panel.textContent=error.code==='permission-denied'?'沒有年度帳本讀取權限，請管理者確認 Income 的 list 規則。':'讀取失敗，請檢查網路。';
                const retry=document.createElement('button');retry.textContent='重新讀取';retry.onclick=()=>openIncomeYear(year,selected);panel.append(retry);if(error.code==='permission-denied') showRules(panel);
            }
        };
        window.openIncome = async function(period, selected) {
            if (!authState.uid || !cloud) return;
            const admin = authState.role === 'admin';
            const stores = [headquarters,...incomeStores];
            if (!stores.length) return;
            const today = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei'}).format(new Date());
            period = /^\d{4}-(0[1-9]|1[0-2])$/.test(period) ? period : today.slice(0,7);
            selected = stores.includes(selected) ? selected : stores[0];
            const company = selected === headquarters;
            const uid = authState.uid;
            const seq = ++incomeRequest;
            currentView = 'income';
            const active = () => currentView==='income' && seq===incomeRequest && uid===authState.uid;
            const ref = store => cloud.incomeRef(store,period);
            app.innerHTML = topbar('月度記帳') + `<main class="page ledger"><button class="back-button" id="ledger-back">← 年度損益</button><div class="section-head"><h1>各店記帳與損益</h1><button id="edit-fixed" class="secondary-button" aria-haspopup="dialog" disabled>修改每月固定項目</button></div>
              <div class="ledger-tools"><label>帳務月份<input type="month" id="ledger-month" value="${period}"></label><label>帳本<select id="ledger-store">${stores.map(s=>`<option ${s===selected?'selected':''} value="${s}">${storeLabel(s)}</option>`).join('')}</select></label></div>
              <section id="ledger-body" aria-live="polite">正在讀取帳本…</section></main>`;
            $('#ledger-back').onclick=()=>openIncomeYear(period.slice(0,4),selected);
            $('#ledger-month').onchange=e=>openIncome(e.target.value,selected);
            $('#ledger-store').onchange=e=>openIncome(period,e.target.value);
            const body=$('#ledger-body');
            let books;
            const settings={};
            try {
                books = Object.fromEntries(await Promise.all((company?stores:[selected]).map(async store=>{
                    const [doc,config]=await Promise.all([cloud.readIncome(ref(store)),cloud.readIncome(cloud.fixedRef(store))]);
                    settings[store]=config.data()?.items||{};
                    return [store,doc.data()?.rows || {}];
                })));
            } catch(error) {
                if(active()) {
                    body.textContent=error.code==='permission-denied'?'目前帳號沒有 Income 讀取權限，請管理者核對 Firestore 規則。':'讀取失敗，請檢查網路後重試。';
                    const retry=document.createElement('button'); retry.textContent='重新讀取';retry.className='secondary-button';
                    retry.onclick=()=>openIncome(period,selected);body.append(retry);
                    if(admin && error.code==='permission-denied'){const details=document.createElement('details');details.innerHTML='<summary>Income 權限設定範例</summary><pre style="overflow:auto"></pre>';details.querySelector('pre').textContent=$('#income-firestore-rules').textContent;body.append(details);}
                }
                return;
            }
            if (!active()) return;
            const rows=books[selected];
            const storeTotals=store=>sumLedger({...books[store],...fixedRows(store,settings[store],period)});
            const totals=storeTotals(selected);
            const branches=company?incomeStores.map(store=>({store,...storeTotals(store)})):[];
            const revenue=company?branches.reduce((sum,b)=>sum+b.profit,0):totals.revenue;
            const ordered=Object.entries(rows).filter(([,row])=>!row.weekly).sort(([,a],[,b])=>a.date.localeCompare(b.date));
            body.innerHTML=`<h2>${storeLabel(selected)} · ${period}</h2><div class="ledger-stats">${[[company?'各店損益合計':'營業收入',revenue],[company?'公司支出':'分店支出',totals.expense],['本期損益',revenue-totals.expense]].map(([label,value],i)=>`<div class="${[company?'profit-zone':'income-zone','expense-zone','profit-zone'][i]}"><span>${label}</span><strong class="${value<0?'loss':''}">${nt(value)}</strong></div>`).join('')}</div>
            ${company?`<details class="zone profit-zone"><summary>各店損益明細（26 店）</summary><div class="ledger-scroll"><table><thead><tr><th>分店</th><th>營業收入</th><th>分店支出</th><th>本期損益</th></tr></thead><tbody>${branches.map(b=>`<tr><td><button type="button" data-store="${b.store}">${storeLabel(b.store)}</button></td><td>${nt(b.revenue)}</td><td>${nt(b.expense)}</td><td>${nt(b.profit)}</td></tr>`).join('')}</tbody></table></div></details>`:''}
            <dialog class="fix-dialog" id="fixed-dialog" aria-labelledby="fixed-title"><header class="section-head fix-head"><h2 id="fixed-title">每月固定項目 · ${storeLabel(selected)} · ${period}</h2><button type="button" class="secondary-button" id="fixed-close" autofocus>關閉</button></header><div class="fix-content">${fixedForm(selected,settings[selected],period)}</div></dialog>
            ${(company?['支出']:['收入','支出']).map(kind=>{
                const income=kind==='收入', entries=ordered.map(([,row],index)=>({row,index})).filter(e=>e.row.kind===kind);
                const fixed=income?[]:Object.values(fixedRows(selected,settings[selected],period));
                return `<section class="zone ${income?'income-zone':'expense-zone'}"><div class="section-head"><h2>${income?'其他收入':(company?'公司支出':'分店支出')}</h2><button data-new-kind="${kind}" class="primary-button">＋ 新增${kind}</button></div>
                <div id="editor-${kind}"></div>${entries.length||fixed.length?`<div class="ledger-scroll"><table><thead><tr><th>日期</th><th>收款人</th><th>項目</th><th>金額</th><th></th></tr></thead><tbody>${fixed.map(row=>`<tr><td>每月固定</td><td>—</td><td>${escapeAttribute(row.item)}</td><td>${nt(row.cents)}</td><td></td></tr>`).join('')}${entries.map(({row,index})=>`<tr><td>${escapeAttribute(row.date)}</td><td>${escapeAttribute(row.payee)||'—'}</td><td>${escapeAttribute(row.item)}</td><td>${nt(row.cents)}</td><td><button data-edit="${index}">編輯</button></td></tr>`).join('')}</tbody></table></div>`:`<p>本月尚無${income?'其他收入':'支出'}。</p>`}</section>`;
            }).join('')}`;
            const dialog=$('#fixed-dialog'), trigger=$('#edit-fixed');
            trigger.disabled=false;
            trigger.onclick=()=>dialog.showModal();
            $('#fixed-close').onclick=()=>dialog.close();
            body.querySelectorAll('[data-store]').forEach(b=>b.onclick=()=>openIncome(period,b.dataset.store));
            body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(...ordered[Number(b.dataset.edit)]));
            body.querySelectorAll('[data-new-kind]').forEach(b=>b.onclick=()=>edit(crypto.randomUUID(),null,b.dataset.newKind));
            if(!company){
                body.querySelector('.ledger-stats').insertAdjacentHTML('afterend',renderWeeks(rows,selected,period));
                bindWeeks(rows,selected,period,active);
            }

            body.querySelectorAll('form[data-fixed]').forEach(form=>{
                const key=form.dataset.fixed, amount=form.elements.amount, scope=form.elements.scope;
                scope.onchange=()=>{amount.disabled=['reset','stop'].includes(scope.value);};
                form.onsubmit=async event=>{
                    event.preventDefault();
                    const mode=scope.value,cents=Math.round(Number(amount.value)*100);
                    const status=form.querySelector('[role=status]'),button=form.querySelector('button');
                    if(['one','forward'].includes(mode) && (!amount.value || !amount.checkValidity()))return;
                    button.disabled=true;status.textContent='儲存中…';
                    try {
                        await cloud.incomeTransaction(async tx=>{
                            const target=cloud.fixedRef(selected);
                            const snap=await tx.get(target),items=snap.data()?.items||{};
                            if((items[key]?.revision||0)!==(settings[selected][key]?.revision||0))throw Error('conflict');
                            tx.set(target,{items:{...items,[key]:changeFixed(items[key],period,mode,cents)}});
                        });
                        if(active()){showToast('固定項目已儲存');openIncome(period,selected);}
                    }catch(error){
                        button.disabled=false;
                        status.textContent=error.message==='conflict'?'其他裝置已更新此項目，請重新讀取帳本。':'設定未儲存，請確認網路及固定項目的讀寫權限。';
                    }
                };
            });
            function edit(id,original,newKind='支出') {
                const row=original || {date:today.startsWith(period)?today:period+'-01',kind:newKind,payee:'',item:newKind==='收入'?'營業收入':'',cents:null};
                const editor=$('#editor-'+row.kind);
                editor.innerHTML=`<form class="ledger-form"><h3>${original?'編輯':'新增'}明細</h3><label>交易日期<input required type="date" name="date" value="${escapeAttribute(row.date)}"></label>
                <label>類別<select name="kind">${(company?['支出']:['收入','支出']).map(k=>`<option ${row.kind===k?'selected':''}>${k}</option>`).join('')}</select></label>
                <label>收款人<input name="payee" maxlength="100" value="${escapeAttribute(row.payee)}"></label>
                <label>項目<input required name="item" maxlength="200" value="${escapeAttribute(row.item)}"></label>
                <label>金額（新臺幣）<input required type="text" pattern="[0-9]{1,10}" title="請輸入 0 至 9999999999 的整數金額" inputmode="numeric" name="amount" value="${row.cents===null?'':Math.round(row.cents/100)}"></label>
                <div><button class="primary-button">儲存</button> <button type="button" class="secondary-button" data-cancel>取消</button> ${original?'<button type="button" data-remove>刪除這筆</button>':''}</div><p role="status"></p></form>`;
                const form=editor.firstElementChild;
                form.elements.kind.onchange=()=>{if(form.elements.kind.value==='支出' && form.elements.item.value==='營業收入')form.elements.item.value='';};
                form.querySelector('[data-cancel]').onclick=()=>editor.replaceChildren();
                form.querySelector('[data-remove]')?.addEventListener('click',()=>{if(confirm('確定刪除這筆明細？'))save(null);});
                form.onsubmit=e=>{
                    e.preventDefault();
                    const fields=new FormData(form);
                    const next={date:fields.get('date'),kind:fields.get('kind'),payee:fields.get('payee').trim(),item:fields.get('item').trim(),cents:Math.round(Number(fields.get('amount'))*100)};
                    if(!next.item){form.querySelector('[role=status]').textContent='請填寫項目。';return;}
                    save(next);
                };
                form.scrollIntoView({block:'nearest'});
                async function save(next) {
                    const status=form.querySelector('[role=status]');
                    [...form.elements].forEach(el=>el.disabled=true);
                    status.textContent='儲存中…';
                    try {
                        await cloud.incomeTransaction(async tx=>{
                            const target=ref(selected), snap=await tx.get(target), saved=snap.data()?.rows || {};
                            const before=saved[id] || null;
                            if (original ? !before || original.revision!==before.revision : before!==null) throw new Error('conflict');
                            const updated={...saved};
                            if(next)updated[id]={...next,revision:(before?.revision||0)+1};
                            else delete updated[id];
                            tx.set(target,{store:selected,period,rows:updated});
                        });
                        if(active()) {showToast('已儲存');openIncome(period,selected);}
                    } catch(error) {
                        [...form.elements].forEach(el=>el.disabled=false);
                        status.textContent=error.message==='conflict'?'這筆資料已被修改，請重新讀取帳本後編輯。':error.code==='permission-denied'?'沒有 Income 寫入權限，這筆資料尚未儲存。':'儲存失敗，請檢查網路後重試。';
                    }
                }
            }
        };

        

        async function initCloud(){
            try{
                const [appApi,authApi,fs]=await Promise.all(
                    ['app','auth','firestore'].map(n=>import('https://www.gstatic.com/firebasejs/10.14.1/firebase-'+n+'.js'))
                );
                const fb=appApi.initializeApp(typeof __firebase_config==='undefined'?firebaseConfig:JSON.parse(__firebase_config),'Income');
                const db=fs.getFirestore(fb);
                const auth=authApi.initializeAuth(fb,{persistence:authApi.inMemoryPersistence});
                cloud={auth,authApi,
                    fixedRef:store=>fs.doc(db,'Income',store,'settings','recurring'),
                    incomeRef:(store,period)=>fs.doc(db,'Income',store,'months',period),
                    readIncome:fs.getDocFromServer,
                    incomeTransaction:fn=>fs.runTransaction(db,fn),
                    incomeYear:(store,year)=>fs.getDocsFromServer(fs.query(fs.collection(db,'Income',store,'months'),
                        fs.where(fs.documentId(),'>=',year+'-01'),fs.where(fs.documentId(),'<=',year+'-12')))
                };
                let denied='';
                authApi.onIdTokenChanged(auth,async user=>{
                    if(!user){authState={uid:'',role:''};incomeRequest++;renderLogin(denied);denied='';return;}
                    try{
                        const {claims}=await user.getIdTokenResult();
                        if(auth.currentUser?.uid!==user.uid)return;
                        if(user.email!==nickEmail || !(claims.admin===true || claims.role==='admin'))throw Error();
                        if(authState.uid===user.uid && currentView!=='login')return;
                        authState={uid:user.uid,role:'admin'};openIncomeYear();
                    }catch{
                        if(auth.currentUser?.uid!==user.uid)return;
                        authState={uid:'',role:''};incomeRequest++;denied='此頁面僅限 Nick 管理者使用。';renderLogin(denied);await authApi.signOut(auth);
                    }
                });
            }catch{cloud=null;renderLogin('無法連上登入服務，請檢查網路後重新整理。');}
        }
        renderLogin('正在連線…');initCloud();
</script></body></html>
